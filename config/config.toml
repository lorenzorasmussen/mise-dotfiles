# mise — user runtimes and dev tools.
#
# System packages are NOT here. `pacman` and the AUR own the base system;
# mise owns runtimes and developer tooling. Mixing them means a tool can exist
# in two versions with no way to tell which one is on PATH.
#
# Merged with, and lower priority than, /etc/mise/conf.d/omarchy.toml. Measured:
# the two files declare 17 and 1 keys respectively with zero overlap, so nothing
# is declared twice.

[tools]
agent-browser = "0.38.2"
bun = "latest"
claude = "latest"
codex = "latest"
copilot = "latest"
cursor-agent = { version = "latest", bin_path = "bin", strip_components = "0", url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(arm64="arm64", x64="x64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/', postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"' }
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
gh = "latest"
"github:can1357/oh-my-pi" = "latest"
go = "latest"
"http:muse" = { version = "latest", url = "https://api.meta.ai/muse-launcher.sh", bin = "muse", version_list_url = "https://api.meta.ai/muse-code/channels/muse-stable", version_json_path = ".version" }
java = "latest"
node = "26.8.1"
"npm:@xai-official/grok" = "latest"
"npm:openclaw" = "2026.9.8"
opencode = "latest"
pi = "latest"
pnpm = "9.15.4"
python = "latest"
ruby = "latest"
uv = "latest"
"zsh-src:zsh" = "latest"

[settings]
# A .ruby-version file may select the Ruby version. Ruby is the only tool here
# with a common idiomatic version file in the projects this host works on.
idiomatic_version_file_enable_tools = ["ruby"]

[settings.upgrade]
# Disk cost of this setting, re-measured 2026-10-03:
#   ~/.local/share/mise/installs = 6.6 GB (was 5.9 GB on 2026-10-02 — still growing)
#
# `auto_prune = false` is what allows that to accumulate: every `mise upgrade`
# installs alongside the old version and removes nothing.
#
# Measured reclaim: `mise prune --dry-run` on 2026-10-03 named 13 stale versions
# totalling 3.67 GB — 56% of installs (node 26.8.1 alone is 750 MB). A further
# 827 MB of oh-my-pi 18.4.x is stale but was not named by the dry run, so the
# true figure is higher.
#
# Now enabled: pruning deletes only versions no config pins, and every deletion is
# recoverable by reinstalling at a pinned version. To inspect before applying:
#
#     mise prune --dry-run
#
# Phase 5 report only. Not applied. See phase5/DISK_REPORT.json for the measured
# inventory and phase5/disk_maintenance.py for the automated version.
auto_prune = true

[settings.ruby]
# Interpreted Ruby: compilation buys nothing here and costs a great deal of
# build time on every upgrade.
compile = false

# ---------------------------------------------------------------------------
# Dotfiles history
# ---------------------------------------------------------------------------
# Everything below uses `mode = "track"`, never `symlink`/`copy`. Tracking only
# records checkpoints in Git; the live file stays exactly where it is and stays
# owned by whatever already owns it.
#
# That ownership split is the whole point on this host:
#   * Omarchy backs up and replaces `~/.config/omarchy/**` on `omarchy refresh`
#     and writes `*.bak.<epoch>` beside anything it touches. A symlink into a
#     dotfiles tree would make Omarchy write through the link into the repo.
#   * `/etc/skel` and Omarchy own `~/.bashrc`, `~/.bash_profile`, `~/.profile`.
#   * Standing rule for this host: live rc files are copied from a repo, never
#     symlinked.
# So mise is the *safety net* here, not the owner: `mise dot rollback` recovers a
# config a bad edit destroyed, without mise ever claiming the file.
[dotfiles]
# -- shell ---------------------------------------------------------------
# These four source ~/.profile.mise, so that one file is the single activation
# point. Tracked, not activated by mise: see the note above on ownership, and
# mise's docs warn against stacking its own activation block on an rc file that
# already runs the hook (it would run the prompt hook twice).
"~/.profile.mise" = { mode = "track" }
"~/.bashrc" = { mode = "track" }
"~/.bash_profile" = { mode = "track" }
"~/.profile" = { mode = "track" }
# zsh is installed via mise (`zsh-src:zsh`, a local backend plugin — mise has no
# zsh in any registry because upstream ships tags but no release assets; see
# ~/.config/mise/plugins/zsh-src/). The file is live config for it.
"~/.zshrc" = { mode = "track" }

# -- mise itself ---------------------------------------------------------
# The setup repository has to contain the mise configuration, or a second
# machine adopting it cannot know which tools, services, or template sources to
# create. This directory is already its own local Git repo; that repo holds
# curated commits, mise's history holds the automatic per-edit checkpoints.
# `.git` is always excluded from history, so the two never collide.
"~/.config/mise" = { mode = "track" }

# -- desktop (Omarchy user config) ---------------------------------------
# ~/.config/omarchy/** is user config and safe to edit; /usr/share/omarchy/**
# is the package and must never be touched. Tracking these gives a rollback for
# a bar or keybinding edit gone wrong.
#
# Tracked as individual entries rather than the whole directory, because
# themes/ (64 MB) and plugins/ (162 MB) live inside it and are downloaded or
# cloned assets, not configuration.
"~/.config/hypr" = { mode = "track" }
"~/.config/omarchy/shell.json" = { mode = "track" }
"~/.config/omarchy/shell.toml" = { mode = "track" }
"~/.config/omarchy/extensions" = { mode = "track" }
"~/.config/omarchy/branding" = { mode = "track" }
"~/.config/omarchy/hooks" = { mode = "track" }
"~/.config/omarchy/defaults" = { mode = "track" }

# -- terminals -----------------------------------------------------------
# Omarchy ships alacritty, foot, kitty and ghostty configs side by side, and
# `omarchy refresh terminal` overwrites whichever one is active. All four are
# live config on this host (measured: exactly one file each, 4 KB apiece), and
# none of them is in a nested git repo.
#
# These are the entries that earn rollback their keep. A terminal config with a
# typo is the classic unrecoverable-looking bad edit: the window never opens,
# so there is nothing on screen to tell you what you broke. Validate a restored
# config by opening a terminal after `mise dot rollback`.
"~/.config/alacritty" = { mode = "track" }
"~/.config/foot" = { mode = "track" }
"~/.config/kitty" = { mode = "track" }
"~/.config/ghostty" = { mode = "track" }
# Decides which of the four a launcher actually starts, so it belongs with them.
"~/.config/xdg-terminals.list" = { mode = "track" }

# -- environment and session ---------------------------------------------
# `environment.d/*.conf` is read by systemd --user for the services it starts,
# which makes it the place an env var goes when it must reach a *service*
# rather than a shell. The single file here is the Hermes GPU override.
"~/.config/environment.d" = { mode = "track" }
# bash is the login shell on this host (`getent passwd lorenzo`), but
# `conf.d/` is where mise-installed tools drop env files (uv.env.fish), so a
# machine that adopts this setup and logs into fish still needs it.
"~/.config/fish" = { mode = "track" }
# XDG autostart: what launches at session start. Losing these changes what runs
# on login with no error at all — bitwarden agent, fcitx5, the print applet.
"~/.config/autostart" = { mode = "track" }

# -- editor and multiplexer ----------------------------------------------
# Hand-edited config that is painful to reconstruct from memory, small, and not
# versioned anywhere else (no nested git repos in either).
"~/.config/nvim" = { mode = "track" }
"~/.config/tmux" = { mode = "track" }

# -- tools and dot -------------------------------------------------------
"~/.gemrc" = { mode = "track" }
"~/.config/git/config" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }

# -- shell completion wiring ----------------------------------------------
# agent-completions.sh is the shared bash+zsh loader for the CLI toolchain
# (herdr, omp, codex, copilot, gh, grok, mise, opencode) and is hand-written
# policy, not build output: the bash branch's lazy-stub mechanism and the zsh
# branch's "fpath before compinit" ordering are both load-bearing and neither
# is recoverable from the file it lives in.
#
# Tracked as two individual files rather than whole directories:
#   * ~/.config/shell also holds openclaw-completions.sh, which rewrites its
#     own sibling completion scripts on CLI update — history would fill with
#     churn (see the note below).
#   * ~/.local/bin also holds hermes, hermes-agent, mise and composio, which are
#     installed binaries and other tools' state, not this repo's config.
# The generated scripts themselves go to ~/.cache/shell-completions and are
# disposable: deleting that directory is always safe, the next interactive
# shell rebuilds it.
"~/.config/shell/agent-completions.sh" = { mode = "track" }
"~/.local/bin/shell-completions-refresh" = { mode = "track" }

# Deliberately NOT tracked:
#   ~/.npmrc            — a credential store. mise's built-in filter does not
#                          cover this name, and `npm login` would land an
#                          _authToken in plaintext Git history. Needs an
#                          encrypted entry (`encrypt = true`) plus
#                          `[history.encryption] recipients` first.
#   ~/.bash_history     — session state, not config.
#   ~/.openclaw/completions/** and the rest of ~/.config/shell/ besides the
#                        loader above — regenerated on CLI update; history
#                        would fill with churn.
#   ~/.config/omarchy/themes (64M), plugins (162M) — downloaded and cloned
#                        assets, regenerated by omarchy, not configuration.
#   ~/.local/share/**   — installed tools; `mise install` owns this.
#   ~/.cache/**         — disposable build output of shell-completions-refresh.

[history]
# `mise refresh` / `omarchy refresh` write `<file>.bak.<epoch>` next to the file
# they replace. Those backups are throwaway copies of a state history already
# records, so they are excluded globally rather than per entry.
exclude = ["*.bak*"]
# Identify the machine in each commit, so a future shared history can be read.
# Only affects new commits; existing ones keep their identity. mise replaces
# `{hostname}` at commit time.
git_email = "mise@{hostname}"

[history.reload]
# Restoring hypr config from a checkpoint should take effect immediately.
# `hyprctl reload` is idempotent and cheap, and Hyprland would pick the change
# up on its own anyway — this just makes the restore observable.
# Validate a restored config with `hyprctl configerrors` after a rollback.
"~/.config/hypr/**" = "hyprctl reload"

[bootstrap.services.mise-history]
# The watcher is what makes tracking automatic: it saves a checkpoint once a
# tracked file has been quiet for `history.watch.debounce` (2s), reconciles
# everything every `history.watch.reconcile` (10m), and saves a file that never
# goes quiet anyway after `history.watch.max_interval` (24h). Without it, edits
# are only saved by an explicit `mise dot save`.
#
# `builtin` implies `scope = "user"` and `restart = "on-failure"`, so this needs
# no root. It deliberately does NOT set `requires_tools = true`: the built-in
# watcher only needs mise itself, and must be running early enough to catch
# changes made during tool installation.
#
# Unit file: ~/.config/systemd/user/dev.mise.mise-history.service
builtin = "history-watch"
