# Force hardware acceleration for Hermes Desktop.
# HERMES_DESKTOP_DISABLE_GPU=0 is the app's documented recovery path: it
# overrides the sticky software-fallback marker left behind by the earlier
# GPU-child crashes (#121954/#124843). Pair with desktop.electron_flags
# --disable-gpu-sandbox in ~/.hermes/config.yaml, which is what actually lets
# the GPU child start on this Intel iGPU.
HERMES_DESKTOP_DISABLE_GPU=0
