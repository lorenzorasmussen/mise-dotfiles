# tmux — sessions and help
bind-key      R  command-prompt -I "#S" "rename-session -- '%%'"
bind-key      C  new-session -c "#{pane_current_path}"
bind-key      K  kill-session
bind-key -n   P  switch-client -p
bind-key -n   N  switch-client -n
bind-key -n M-Up   switch-client -p
bind-key -n M-Down switch-client -n

bind-key -N "Show tmux keybindings" ? display-popup -E -w 80% -h 70% -T "tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"
