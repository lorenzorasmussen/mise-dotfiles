# tmux — prefix, indexing, mouse
#
# Ctrl+s is the prefix, as specified. Ctrl-Space moves to prefix2 rather than
# disappearing: it was the previous prefix on this host (tmux.conf.bak line 2),
# and dropping it would silently break the muscle memory of every existing
# session. Both keys send a literal prefix when pressed twice.

set -g prefix C-s
set -g prefix2 C-Space
bind-key -T prefix C-s     send-prefix
bind-key -T prefix C-Space send-prefix

# Windows and panes start at 1, and windows renumber so a closed window never
# leaves a hole in the sequence.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

# Terminal capabilities. `extended-keys` is what lets tmux report CSI-u style
# keys, which the modern terminal profiles on this host send.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"

# `escape-time` appears exactly once. The previous file set it twice —
# `set -g escape-time 0` at line 72 and `set -sg escape-time 10` at line 82 —
# with different scopes and different values, so the effective value depended on
# which line tmux happened to read last. 10ms is chosen because 0 makes a bare
# Escape indistinguishable from the start of a sequence, which shows up as
# intermittent "escape did not register" when using vi-mode copy.
set -g escape-time 10

set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off