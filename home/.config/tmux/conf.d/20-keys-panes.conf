# tmux — pane and window navigation
#
# vi-mode copy: prefix + [ starts a selection, y copies it.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane controls. The `-n` variants are prefix-free so they work without holding
# the prefix; the short keys keep working for anyone used to plain vim motion.
bind-key -n M-Enter      split-window -v -c "#{pane_current_path}"
bind-key -n M-S-Enter    split-window -h -c "#{pane_current_path}"
bind-key -n M-Escape     kill-pane
bind-key      h           split-window -v -c "#{pane_current_path}"
bind-key      v           split-window -h -c "#{pane_current_path}"
bind-key      x           kill-pane

bind-key -n C-M-Left   select-pane -L
bind-key -n C-M-Right  select-pane -R
bind-key -n C-M-Up     select-pane -U
bind-key -n C-M-Down   select-pane -D

bind-key -n C-M-S-Left  resize-pane -L 5
bind-key -n C-M-S-Down resize-pane -D 5
bind-key -n C-M-S-Up   resize-pane -U 5
bind-key -n C-M-S-Right resize-pane -R 5

# Windows. With renumber-windows on, `select-window -t 1` still tracks the
# visible index, so the numeric bindings stay correct after a close.
bind-key      r  command-prompt -I "#W" "rename-window -- '%%'"
bind-key      c  new-window -c "#{pane_current_path}"
bind-key      k  kill-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-Left    select-window -t -1
bind-key -n M-Right   select-window -t +1
bind-key -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind-key -n M-S-Right swap-window -t +1 \; select-window -t +1
